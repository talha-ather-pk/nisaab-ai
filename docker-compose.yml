# Nisaab AI — local / single-host stack
#   cp .env.example .env      # then edit secrets
#   docker compose up -d --build
#   docker compose exec api python seed.py      # optional demo data
#
# API:  http://localhost:8000/docs

name: nisaab

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nisaab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nisaab}
      TZ: Asia/Karachi
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied automatically the first time the volume is initialised.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nisaab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nisaab}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TIMEZONE: ${TIMEZONE:-Asia/Karachi}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5-5}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
